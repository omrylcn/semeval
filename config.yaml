# SemEval Framework Configuration
# ================================
# This file contains default configuration for the SemEval framework.
# Settings can be overridden by:
#   1. Environment variables (e.g., SEMEVAL_MODEL__NAME=custom-model)
#   2. .env file
#   3. Custom config file via CONFIG_PATH environment variable

# Application Metadata
app_name: "SemEval"
app_version: "0.1.0"
app_description: "Semantic Evaluation Framework for Turkish NLP"

# Model Configuration
model:
  # Model name or path (HuggingFace model ID or local path)
  name: "emrecan/bert-base-turkish-cased-mean-nli-stsb-tr"

  # Device: auto (automatic detection), cpu, cuda, mps
  device: "auto"

  # Batch size for encoding
  batch_size: 32

# Output Configuration
output:
  # Base directory for all outputs
  base_dir: "./output"

  # Export formats to generate: json, csv, markdown
  export_formats:
    - "json"
    - "csv"
    - "markdown"

  # Generate comprehensive report with analysis
  save_comprehensive_report: true

# Task Configurations
tasks:
  # Information Retrieval Task
  information_retrieval:
    enabled: true
    ndcg_at_k: [1, 3, 5, 10]
    map_at_k: [10]
    mrr_at_k: [10]

  # Semantic Similarity Task
  semantic_similarity:
    enabled: true
    margin_threshold: 0.0  # Minimum margin for successful triplet

  # Linguistic Robustness Task
  linguistic_robustness:
    enabled: true
    morphology_threshold: 0.85  # High similarity = good (same meaning despite morphology)
    typo_threshold: 0.75        # High similarity = good (typo didn't confuse model)
    negation_threshold: 0.50    # Low similarity = good (model detected negation)

  # Vector Arithmetic Task
  vector_arithmetic:
    enabled: true
    top_k: [1, 5, 10]  # Calculate Top-1, Top-5, Top-10 accuracy

# Logging Configuration
logging:
  # Verbose mode (show progress bars, detailed logs)
  verbose: false

  # Log level: DEBUG, INFO, WARNING, ERROR, CRITICAL
  level: "INFO"

  # Directory for log files
  log_dir: "logs"

# ============================================================================
# Environment Variable Override Examples:
# ============================================================================
#
# Override model:
#   SEMEVAL_MODEL__NAME=custom-model
#   SEMEVAL_MODEL__DEVICE=cuda
#   SEMEVAL_MODEL__BATCH_SIZE=64
#
# Override output:
#   SEMEVAL_OUTPUT__BASE_DIR=./results
#   SEMEVAL_OUTPUT__EXPORT_FORMATS='["json","csv"]'
#
# Override task settings:
#   SEMEVAL_TASKS__INFORMATION_RETRIEVAL__ENABLED=false
#   SEMEVAL_TASKS__LINGUISTIC_ROBUSTNESS__MORPHOLOGY_THRESHOLD=0.90
#
# Override logging:
#   SEMEVAL_LOGGING__VERBOSE=true
#   SEMEVAL_LOGGING__LEVEL=DEBUG
#
# ============================================================================
# Custom Config File:
# ============================================================================
#
# Use a different config file:
#   CONFIG_PATH=config.prod.yaml python main.py
#
# Or in code:
#   settings = load_settings("config.prod.yaml")
#
# ============================================================================
